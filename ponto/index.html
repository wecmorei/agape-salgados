<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12352c" />
    <meta name="description" content="Relógio de ponto. As batidas ficam salvas neste navegador." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ponto" />
    <title>Ponto</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c6e52'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #e5eef2;
        --ink: #122028;
        --muted: #45606c;
        --paper: #ffffff;
        --line: #d3e0e6;
        --green: #0c6e52;
        --green-dark: #084e3b;
        --saldo: #10261f;
        --saldo-ink: #f6f3ea;
        --saldo-muted: #d7d1c3;
        --amber: #8a5a10;
        --amber-soft: #f8efd9;
        --shadow: 0 14px 34px rgba(16, 32, 40, 0.08);
        --radius: 18px;
        color-scheme: light;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(900px 420px at 0% -10%, #f8fbfc 0%, transparent 55%),
          var(--bg);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 3.4rem);
        letter-spacing: -0.045em;
        line-height: 0.95;
        font-weight: 700;
      }

      .month-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 0;
      }

      #month-label {
        font-size: 1.05rem;
        color: var(--muted);
        min-width: 11rem;
        text-align: center;
      }

      .month-row button,
      .undo {
        font: inherit;
        cursor: pointer;
      }

      .month-row button {
        border: 0;
        background: transparent;
        color: var(--green-dark);
        font-weight: 700;
        padding: 6px 4px;
      }

      .month-row button:disabled {
        color: #9aafb8;
        cursor: not-allowed;
      }

      .clock {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--paper);
        box-shadow: var(--shadow);
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #8aa0ab;
      }

      .status.working::before { background: var(--green); }
      .status.break {
        background: var(--amber-soft);
        color: #6d470c;
      }
      .status.break::before { background: var(--amber); }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .actions button,
      .undo {
        min-height: 52px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        padding: 12px 14px;
      }

      .actions button { cursor: pointer; }

      .actions button.primary:not(:disabled) {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }

      .actions button.primary:not(:disabled):hover { background: var(--green-dark); }

      .actions button:disabled,
      .undo:disabled {
        color: #8aa0ab;
        background: #f2f6f8;
        border-color: #e4ecef;
        cursor: not-allowed;
      }

      .hint,
      .note,
      .footer,
      .carga p,
      .metric p,
      .undo-detail,
      #notice {
        color: var(--muted);
      }

      .hint,
      #notice,
      .undo-detail {
        margin: 10px 2px;
        line-height: 1.45;
      }

      #notice:empty,
      .undo-detail:empty { display: none; }

      #notice { min-height: 0; font-weight: 700; color: var(--green-dark); }

      .undo { width: 100%; background: transparent; }

      .undo:not(:disabled):hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }

      .saldo-card,
      .metric,
      .carga,
      .day {
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .saldo-card {
        grid-column: 1 / -1;
        background: var(--saldo);
        color: var(--saldo-ink);
        padding: 22px 22px 20px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .saldo-card .eyebrow,
      .formula { color: var(--saldo-muted); }

      .saldo-value,
      .metric-value,
      .day-total,
      .punch-time,
      .clock,
      #carga {
        font-variant-numeric: tabular-nums;
      }

      .saldo-value {
        margin: 10px 0 0;
        font-family: Georgia, "Iowan Old Style", Palatino, serif;
        font-size: clamp(2.5rem, 8vw, 3.7rem);
        letter-spacing: -0.03em;
        line-height: 0.95;
        font-weight: 600;
      }

      .formula { margin: 14px 0 0; font-size: 0.95rem; }

      .metric {
        background: var(--paper);
        padding: 16px 16px 14px;
      }

      .metric .eyebrow { color: var(--muted); }

      .metric-value {
        margin: 8px 0 0;
        font-size: clamp(1.45rem, 4vw, 1.9rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .metric p,
      .carga p,
      .footer,
      .note {
        margin: 6px 0 0;
        font-size: 0.92rem;
        line-height: 1.4;
      }

      .carga {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
        padding: 16px 18px;
        background: #f7f1e6;
      }

      .carga label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .carga-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }

      #carga {
        width: 5.4rem;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        text-align: center;
        border: 0;
        border-radius: 12px;
        padding: 10px 8px;
        background: white;
        color: var(--ink);
      }

      h2 {
        margin: 28px 0 12px;
        font-size: 1.35rem;
      }

      .day {
        background: var(--paper);
        padding: 14px 16px 12px;
        margin-bottom: 10px;
      }

      .day.today { box-shadow: inset 3px 0 0 var(--green), var(--shadow); }

      .day-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      .day-head h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }

      .badge {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #e5f4ee;
        color: var(--green-dark);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        vertical-align: 1px;
      }

      .day-total {
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .punches { list-style: none; margin: 8px 0 0; padding: 0; }

      .punch {
        display: flex;
        gap: 12px;
        padding: 5px 0;
      }

      .punch-time { min-width: 3.2rem; font-weight: 700; }

      .empty-month {
        margin: 0;
        color: var(--muted);
      }

      .footer { margin-top: 22px; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 2px;
      }

      @media (min-width: 720px) {
        .actions { grid-template-columns: 1fr 1fr; }
      }

      @media (min-width: 840px) {
        .summary { grid-template-columns: 1.4fr 1fr; }
        .saldo-card { grid-column: 1; grid-row: 1 / span 2; }
        .metric-hours { grid-column: 2; grid-row: 1; }
        .metric-rate { grid-column: 2; grid-row: 2; }
      }

      @media (max-width: 640px) {
        main { width: min(100% - 24px, 920px); padding-top: 20px; }
        .top { align-items: flex-start; }
        .carga { align-items: stretch; flex-direction: column; }
        #month-label { min-width: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <h1>Ponto</h1>
          <p class="month-row">
            <button type="button" id="prev-month">Anterior</button>
            <span id="month-label"></span>
            <button type="button" id="next-month">Próximo</button>
          </p>
        </div>
        <p id="clock" class="clock"></p>
      </header>

      <p id="status" class="status" role="status">Fora do expediente</p>

      <div class="actions">
        <button type="button" id="btn-entrada">Entrada</button>
        <button type="button" id="btn-saida">Saída</button>
        <button type="button" id="btn-intervalo-inicio">Início do intervalo</button>
        <button type="button" id="btn-intervalo-fim">Fim do intervalo</button>
      </div>
      <p class="hint">O intervalo não conta como hora trabalhada. Só uma jornada fica aberta por vez.</p>
      <p id="notice" role="status"></p>
      <button type="button" class="undo" id="btn-desfazer">Desfazer</button>
      <p id="undo-detail" class="undo-detail"></p>

      <h2 class="sr-only">Resumo do mês</h2>
      <section class="summary">
        <article class="saldo-card">
          <p class="eyebrow">Saldo a receber</p>
          <p id="saldo" class="saldo-value">R$ 0,00</p>
          <p id="formula" class="formula"></p>
        </article>
        <article class="metric metric-hours">
          <p class="eyebrow">Horas no mês</p>
          <p id="horas" class="metric-value">0h 00min</p>
        </article>
        <article class="metric metric-rate">
          <p class="eyebrow">Valor/hora</p>
          <p id="valor-hora" class="metric-value">R$ 38,64</p>
          <p id="valor-hora-detalhe"></p>
        </article>
      </section>

      <section class="carga">
        <div>
          <label for="carga">Carga horária mensal</label>
          <p>Padrão de 220 h. O mês cheio vale R$ 8.500,00.</p>
        </div>
        <div class="carga-row">
          <input id="carga" type="number" min="1" step="1" inputmode="numeric" value="220" />
          <span>horas</span>
        </div>
      </section>

      <h2>Dias</h2>
      <div id="dias"></div>
      <p class="footer">As batidas ficam salvas neste navegador.</p>
    </main>

    <noscript>Ative o JavaScript para registrar o ponto.</noscript>

    <script>
      (() => {
        const TZ = 'America/Sao_Paulo';
        const SALARIO = 8500;
        const DEFAULT_CARGA = 220;
        const STORAGE_KEY = 'ponto.v1';
        const TYPES = ['entrada', 'saida', 'inicio_intervalo', 'fim_intervalo'];
        const LABELS = {
          entrada: 'Entrada',
          saida: 'Saída',
          inicio_intervalo: 'Início do intervalo',
          fim_intervalo: 'Fim do intervalo',
        };
        const NOTICE = {
          entrada: 'Entrada registrada',
          saida: 'Saída registrada',
          inicio_intervalo: 'Início do intervalo registrado',
          fim_intervalo: 'Fim do intervalo registrado',
        };
        const UNDONE = {
          entrada: 'Entrada desfeita.',
          saida: 'Saída desfeita.',
          inicio_intervalo: 'Início do intervalo desfeito.',
          fim_intervalo: 'Fim do intervalo desfeito.',
        };

        const els = {
          clock: document.getElementById('clock'),
          month: document.getElementById('month-label'),
          prev: document.getElementById('prev-month'),
          next: document.getElementById('next-month'),
          status: document.getElementById('status'),
          entrada: document.getElementById('btn-entrada'),
          saida: document.getElementById('btn-saida'),
          inicio: document.getElementById('btn-intervalo-inicio'),
          fim: document.getElementById('btn-intervalo-fim'),
          undo: document.getElementById('btn-desfazer'),
          undoDetail: document.getElementById('undo-detail'),
          notice: document.getElementById('notice'),
          saldo: document.getElementById('saldo'),
          formula: document.getElementById('formula'),
          horas: document.getElementById('horas'),
          rate: document.getElementById('valor-hora'),
          rateDetail: document.getElementById('valor-hora-detalhe'),
          carga: document.getElementById('carga'),
          dias: document.getElementById('dias'),
        };

        let state = load();
        let view = currentMonth();
        let notice = '';
        let dayKey = '';
        let undoArmedUntil = 0;

        function zonedParts(date) {
          const fmt = new Intl.DateTimeFormat('en-US', {
            timeZone: TZ,
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23',
          });
          const map = {};
          for (const part of fmt.formatToParts(date)) map[part.type] = part.value;
          let hour = Number(map.hour);
          if (hour === 24) hour = 0;
          return {
            year: Number(map.year),
            month: Number(map.month),
            day: Number(map.day),
            hour,
            minute: Number(map.minute),
            second: Number(map.second),
          };
        }

        function tzOffsetMs(date) {
          const parts = zonedParts(date);
          const asUtc = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
          const trimmed = Math.floor(date.getTime() / 1000) * 1000;
          return asUtc - trimmed;
        }

        function zonedToUtc(year, month, day, hour, minute, second) {
          const guess = Date.UTC(year, month - 1, day, hour, minute, second);
          let instant = guess - tzOffsetMs(new Date(guess));
          const adjusted = guess - tzOffsetMs(new Date(instant));
          if (adjusted !== instant) instant = adjusted;
          return instant;
        }

        function currentMonth(now = new Date()) {
          const parts = zonedParts(now);
          return { year: parts.year, month: parts.month };
        }

        function monthIndex(year, month) {
          return year * 12 + (month - 1);
        }

        function daysInMonth(year, month) {
          return new Date(Date.UTC(year, month, 0)).getUTCDate();
        }

        function addDays(year, month, day, amount) {
          const date = new Date(Date.UTC(year, month - 1, day + amount));
          return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
        }

        function monthBounds(year, month) {
          const start = zonedToUtc(year, month, 1, 0, 0, 0);
          const next = month === 12 ? { year: year + 1, month: 1 } : { year, month: month + 1 };
          const end = zonedToUtc(next.year, next.month, 1, 0, 0, 0);
          return { start, end };
        }

        function dayBounds(year, month, day) {
          const start = zonedToUtc(year, month, day, 0, 0, 0);
          const next = addDays(year, month, day, 1);
          const end = zonedToUtc(next.year, next.month, next.day, 0, 0, 0);
          return { start, end };
        }

        function formatBRL(value) {
          const negative = value < 0;
          const cents = Math.round(Math.abs(value) * 100);
          const reais = Math.floor(cents / 100);
          const frac = String(cents % 100).padStart(2, '0');
          const ints = String(reais).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${negative ? '-' : ''}R$ ${ints},${frac}`;
        }

        function formatHM(ms) {
          const safe = Number.isFinite(ms) && ms > 0 ? ms : 0;
          const totalMin = Math.floor(safe / 60000);
          const hours = Math.floor(totalMin / 60);
          const minutes = totalMin % 60;
          return `${hours}h ${String(minutes).padStart(2, '0')}min`;
        }

        function formatCarga(value) {
          return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(value);
        }

        function formatClock(date) {
          return new Intl.DateTimeFormat('pt-BR', {
            timeZone: TZ,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23',
          }).format(date);
        }

        function formatTime(value) {
          return new Intl.DateTimeFormat('pt-BR', {
            timeZone: TZ,
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23',
          }).format(new Date(value));
        }

        function capitalize(text) {
          return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
        }

        function formatMonth(year, month) {
          const label = new Intl.DateTimeFormat('pt-BR', {
            timeZone: TZ,
            month: 'long',
            year: 'numeric',
          }).format(new Date(zonedToUtc(year, month, 1, 12, 0, 0)));
          return capitalize(label);
        }

        function formatDay(year, month, day) {
          const label = new Intl.DateTimeFormat('pt-BR', {
            timeZone: TZ,
            weekday: 'short',
            day: '2-digit',
            month: 'short',
          }).format(new Date(zonedToUtc(year, month, day, 12, 0, 0)));
          return capitalize(label);
        }

        function computeSaldo(workedMs, carga) {
          if (!(workedMs > 0) || !(carga > 0)) return 0;
          const raw = (workedMs * SALARIO) / (3600000 * carga);
          return Math.round(raw * 100) / 100;
        }

        function computeRate(carga) {
          if (!(carga > 0)) return 0;
          return Math.round((SALARIO / carga) * 100) / 100;
        }

        function uid() {
          if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function load() {
          const empty = { carga: DEFAULT_CARGA, punches: [] };
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return empty;
            const data = JSON.parse(raw);
            let carga = Number(data && data.carga);
            if (!Number.isFinite(carga) || carga < 1) carga = DEFAULT_CARGA;
            carga = Math.round(carga * 100) / 100;
            const punches = Array.isArray(data && data.punches)
              ? data.punches.filter(validPunch).map((punch, index) => ({
                  id: typeof punch.id === 'string' && punch.id ? punch.id : `p${index}`,
                  type: punch.type,
                  at: new Date(punch.at).toISOString(),
                }))
              : [];
            return { carga, punches };
          } catch {
            return empty;
          }
        }

        function validPunch(punch) {
          return Boolean(punch)
            && TYPES.includes(punch.type)
            && Number.isFinite(new Date(punch.at).getTime());
        }

        function save() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              carga: state.carga,
              punches: state.punches.map(({ id, type, at }) => ({ id, type, at })),
            }));
          } catch {
            notice = 'Não foi possível salvar neste navegador.';
          }
        }

        function interpret(punches, now) {
          const list = punches
            .map((punch, index) => ({ punch, index, at: new Date(punch.at).getTime() }))
            .filter((item) => TYPES.includes(item.punch.type) && Number.isFinite(item.at))
            .sort((a, b) => a.at - b.at || a.index - b.index);

          let status = 'off';
          let cursor = null;
          let openSince = null;
          let breakSince = null;
          const segments = [];

          for (const item of list) {
            const at = item.at;
            const type = item.punch.type;

            if (type === 'entrada') {
              if (status !== 'off') continue;
              status = 'working';
              cursor = at;
              openSince = at;
              breakSince = null;
              continue;
            }

            if (type === 'inicio_intervalo') {
              if (status !== 'working' || at < cursor) continue;
              if (at > cursor) segments.push({ start: cursor, end: at });
              status = 'break';
              breakSince = at;
              cursor = at;
              continue;
            }

            if (type === 'fim_intervalo') {
              if (status !== 'break' || at < breakSince) continue;
              status = 'working';
              cursor = at;
              breakSince = null;
              continue;
            }

            if (type === 'saida') {
              if (status === 'working') {
                if (at < cursor) continue;
                if (at > cursor) segments.push({ start: cursor, end: at });
              } else if (status === 'break') {
                if (at < breakSince) continue;
              } else {
                continue;
              }
              status = 'off';
              cursor = null;
              openSince = null;
              breakSince = null;
            }
          }

          if (status === 'working' && cursor != null && now > cursor) {
            segments.push({ start: cursor, end: now });
          }

          return { segments, status, openSince, breakSince };
        }

        function overlap(segments, start, end) {
          let total = 0;
          for (const segment of segments) {
            const from = Math.max(segment.start, start);
            const to = Math.min(segment.end, end);
            if (to > from) total += to - from;
          }
          return total;
        }

        function setText(node, text) {
          if (node.textContent !== text) node.textContent = text;
        }

        function lastPunch() {
          let found = null;
          state.punches.forEach((punch, index) => {
            const at = new Date(punch.at).getTime();
            if (!Number.isFinite(at)) return;
            if (!found || at > found.at || (at === found.at && index > found.index)) {
              found = { punch, at, index };
            }
          });
          return found;
        }

        function allowed(status) {
          return {
            entrada: status === 'off',
            saida: status === 'working' || status === 'break',
            inicio_intervalo: status === 'working',
            fim_intervalo: status === 'break',
          };
        }

        function punch(type) {
          const now = Date.now();
          const { status } = interpret(state.punches, now);
          if (!allowed(status)[type]) return;
          state.punches.push({ id: uid(), type, at: new Date(now).toISOString() });
          notice = `${NOTICE[type]} às ${formatTime(now)}.`;
          undoArmedUntil = 0;
          view = currentMonth(new Date(now));
          save();
          render();
        }

        function undo() {
          const found = lastPunch();
          if (!found) return;
          const recent = Date.now() - found.at < 2 * 60 * 1000;
          if (!recent && Date.now() > undoArmedUntil) {
            undoArmedUntil = Date.now() + 6000;
            notice = 'Toque de novo para desfazer.';
            render();
            return;
          }
          undoArmedUntil = 0;
          state.punches.splice(found.index, 1);
          notice = UNDONE[found.punch.type] || 'Batida desfeita.';
          save();
          render();
        }

        function renderDays(segments, status, today, now) {
          const key = [
            view.year,
            view.month,
            status,
            Math.floor(now / 60000),
            state.punches.map((item) => `${item.type}@${item.at}`).join('|'),
          ].join('~');
          if (key === dayKey) return;
          dayKey = key;

          const fragment = document.createDocumentFragment();
          const count = daysInMonth(view.year, view.month);
          let cards = 0;
          const viewingCurrent = view.year === today.year && view.month === today.month;

          for (let day = count; day >= 1; day -= 1) {
            const bounds = dayBounds(view.year, view.month, day);
            const worked = overlap(segments, bounds.start, bounds.end);
            const punches = state.punches
              .filter((item) => {
                const parts = zonedParts(new Date(item.at));
                return parts.year === view.year && parts.month === view.month && parts.day === day;
              })
              .sort((a, b) => new Date(a.at) - new Date(b.at));
            const isToday = viewingCurrent && day === today.day;
            if (!punches.length && worked <= 0 && !isToday) continue;

            const card = document.createElement('article');
            card.className = isToday ? 'day today' : 'day';

            const head = document.createElement('div');
            head.className = 'day-head';
            const title = document.createElement('h3');
            title.textContent = formatDay(view.year, view.month, day);
            if (isToday) {
              const badge = document.createElement('span');
              badge.className = 'badge';
              badge.textContent = 'Hoje';
              title.append(badge);
            }
            const total = document.createElement('p');
            total.className = 'day-total';
            total.textContent = formatHM(worked);
            head.append(title, total);
            card.append(head);

            if (!punches.length && worked <= 0) {
              const empty = document.createElement('p');
              empty.className = 'note';
              empty.textContent = 'Nenhuma batida neste dia.';
              card.append(empty);
              if (isToday && status !== 'off') {
                const open = document.createElement('p');
                open.className = 'note';
                open.textContent = 'Jornada em aberto.';
                card.append(open);
              }
            } else {
              if (punches.length) {
                const list = document.createElement('ul');
                list.className = 'punches';
                for (const item of punches) {
                  const row = document.createElement('li');
                  row.className = 'punch';
                  const time = document.createElement('span');
                  time.className = 'punch-time';
                  time.textContent = formatTime(item.at);
                  const label = document.createElement('span');
                  label.textContent = LABELS[item.type] || item.type;
                  row.append(time, label);
                  list.append(row);
                }
                card.append(list);
              }
              const startedBefore = segments.some((segment) => segment.start < bounds.start && segment.end > bounds.start);
              if (startedBefore && worked > 0) {
                const note = document.createElement('p');
                note.className = 'note';
                note.textContent = 'Inclui horas que começaram no dia anterior.';
                card.append(note);
              }
              if (isToday && status !== 'off') {
                const open = document.createElement('p');
                open.className = 'note';
                open.textContent = 'Jornada em aberto.';
                card.append(open);
              }
            }

            fragment.append(card);
            cards += 1;
          }

          els.dias.replaceChildren(fragment);
          if (!cards) {
            const empty = document.createElement('p');
            empty.className = 'empty-month';
            empty.textContent = 'Nenhuma batida neste mês.';
            els.dias.append(empty);
          }
        }

        function render() {
          const nowDate = new Date();
          const now = nowDate.getTime();
          const today = zonedParts(nowDate);
          const { segments, status, openSince, breakSince } = interpret(state.punches, now);
          const bounds = monthBounds(view.year, view.month);
          const worked = overlap(segments, bounds.start, bounds.end);
          const saldo = computeSaldo(worked, state.carga);
          const rate = computeRate(state.carga);
          const cargaLabel = formatCarga(state.carga);

          setText(els.clock, formatClock(nowDate));
          setText(els.month, formatMonth(view.year, view.month));

          let statusText = 'Fora do expediente';
          if (status === 'working') statusText = `Em expediente · desde ${formatTime(openSince)}`;
          if (status === 'break') statusText = `Em intervalo · desde ${formatTime(breakSince)}`;
          setText(els.status, statusText);
          els.status.className = `status ${status === 'off' ? 'off' : status}`;

          const can = allowed(status);
          els.entrada.disabled = !can.entrada;
          els.saida.disabled = !can.saida;
          els.inicio.disabled = !can.inicio_intervalo;
          els.fim.disabled = !can.fim_intervalo;

          const primary = status === 'off' ? 'entrada' : status === 'break' ? 'fim' : 'saida';
          els.entrada.classList.toggle('primary', primary === 'entrada');
          els.saida.classList.toggle('primary', primary === 'saida');
          els.inicio.classList.toggle('primary', false);
          els.fim.classList.toggle('primary', primary === 'fim');

          const latest = lastPunch();
          els.undo.disabled = !latest;
          setText(els.undo, Date.now() < undoArmedUntil ? 'Confirmar desfazer' : 'Desfazer');
          if (latest) {
            const label = LABELS[latest.punch.type] || 'Batida';
            const when = formatTime(latest.at);
            setText(els.undoDetail, `Remove a última batida: ${label} às ${when}.`);
            els.undo.setAttribute('aria-label', `Desfazer ${label} das ${when}`);
          } else {
            setText(els.undoDetail, '');
            els.undo.setAttribute('aria-label', 'Desfazer');
          }

          setText(els.notice, notice);
          setText(els.saldo, formatBRL(saldo));
          setText(els.horas, formatHM(worked));
          setText(els.rate, formatBRL(rate));
          setText(els.rateDetail, `${formatBRL(SALARIO)} ÷ ${cargaLabel} h`);
          setText(els.formula, `${formatHM(worked)} × (${formatBRL(SALARIO)} ÷ ${cargaLabel} h)`);

          if (document.activeElement !== els.carga) {
            const shown = Number.isInteger(state.carga) ? String(state.carga) : String(state.carga);
            if (els.carga.value !== shown) els.carga.value = shown;
          }

          const current = monthIndex(today.year, today.month);
          els.next.disabled = monthIndex(view.year, view.month) >= current;
          els.prev.disabled = monthIndex(view.year, view.month) <= monthIndex(2000, 1);

          renderDays(segments, status, today, now);
        }

        function shiftMonth(delta) {
          const today = zonedParts(new Date());
          const current = monthIndex(today.year, today.month);
          const next = monthIndex(view.year, view.month) + delta;
          if (next > current || next < monthIndex(2000, 1)) return;
          view = { year: Math.floor(next / 12), month: (next % 12) + 1 };
          render();
        }

        els.entrada.addEventListener('click', () => punch('entrada'));
        els.saida.addEventListener('click', () => punch('saida'));
        els.inicio.addEventListener('click', () => punch('inicio_intervalo'));
        els.fim.addEventListener('click', () => punch('fim_intervalo'));
        els.undo.addEventListener('click', undo);
        els.prev.addEventListener('click', () => shiftMonth(-1));
        els.next.addEventListener('click', () => shiftMonth(1));

        els.carga.addEventListener('input', () => {
          const value = Number(els.carga.value);
          if (Number.isFinite(value) && value >= 1) {
            state.carga = Math.round(value * 100) / 100;
            save();
          }
          render();
        });

        els.carga.addEventListener('blur', () => {
          const shown = Number.isInteger(state.carga) ? String(state.carga) : String(state.carga);
          els.carga.value = shown;
        });

        window.addEventListener('storage', (event) => {
          if (event.key !== STORAGE_KEY) return;
          state = load();
          dayKey = '';
          render();
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) render();
        });

        render();
        setInterval(render, 1000);
      })();
    </script>
  </body>
</html>
